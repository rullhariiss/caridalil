<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi - Frontend Example</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans antialiased text-slate-900">

    <!-- ================= 1. HALAMAN LOGIN ================= -->
    <div id="login-page" class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white font-bold text-xl shadow-lg">
                🚀
            </div>
            <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-slate-900">Masuk ke Akun Anda</h2>
            <p class="mt-2 text-center text-sm text-slate-600">
                Atau <span class="font-medium text-indigo-600 hover:text-indigo-500 cursor-pointer">daftar akun baru</span>
            </p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-sm">
            <div class="bg-white px-6 py-8 shadow-xl ring-1 ring-slate-900/5 sm:rounded-xl sm:px-10">
                <form class="space-y-6" onsubmit="handleLogin(event)">
                    <div>
                        <label for="email" class="block text-sm font-medium leading-6 text-slate-900">Alamat Email</label>
                        <div class="mt-2">
                            <input id="email" name="email" type="email" autocomplete="email" required 
                                class="block w-full rounded-md border-0 py-2 px-3 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                                placeholder="nama@domain.com">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between">
                            <label for="password" class="block text-sm font-medium leading-6 text-slate-900">Kata Sandi</label>
                            <div class="text-sm">
                                <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Lupa sandi?</a>
                            </div>
                        </div>
                        <div class="mt-2">
                            <input id="password" name="password" type="password" autocomplete="current-password" required 
                                class="block w-full rounded-md border-0 py-2 px-3 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div>
                        <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all">
                            Masuk
                        </button>
                    </div>
                </form>

                <div class="mt-6 border-t border-slate-100 pt-6">
                    <p class="text-xs text-center text-slate-500">
                        Tips Demo: Masukkan email & password bebas untuk masuk ke Dashboard.
                    </p>
                </div>
            </div>
        </div>
    </div>


    <!-- ================= 2. HALAMAN DASHBOARD (Hidden by Default) ================= -->
    <div id="dashboard-page" class="hidden min-h-full flex flex-col">
        <!-- Navbar -->
        <nav class="bg-white border-b border-slate-200">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600 text-white font-bold">
                            🚀
                        </div>
                        <span class="font-bold text-lg text-slate-900">AppDashboard</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="user-display-email" class="text-sm font-medium text-slate-700">user@email.com</span>
                        <button onclick="handleLogout()" class="rounded-md bg-slate-100 px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-slate-200 transition-all">
                            Keluar
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 py-10">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <!-- Header Title -->
                <div class="mb-8">
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Ringkasan Sistem</h1>
                    <p class="text-sm text-slate-600">Selamat datang kembali di panel kontrol frontend Anda.</p>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 gap-5 sm:grid-cols-3 mb-8">
                    <div class="overflow-hidden rounded-xl bg-white px-4 py-5 shadow-sm ring-1 ring-slate-900/5 sm:p-6">
                        <dt class="truncate text-sm font-medium text-slate-500">Total Pengguna</dt>
                        <dd class="mt-1 text-3xl font-semibold tracking-tight text-slate-900">12,482</dd>
                        <span class="text-xs text-emerald-600 font-medium">↑ 12% dari bulan lalu</span>
                    </div>
                    <div class="overflow-hidden rounded-xl bg-white px
